services:
  db:
    # Свой образ: postgres:16 + pgvector (docker/postgres/Dockerfile). FROM
    # postgres:16 → glibc как у прод-тома (Debian 13) → нет collation-mismatch,
    # REINDEX не нужен. deploy.yml `up -d --build` пересоберёт db автоматически.
    build:
      context: docker/postgres
      provenance: false
      sbom: false
    container_name: nexus-arcana-db
    environment:
      POSTGRES_USER: kai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevpass}
      POSTGRES_DB: nexus_arcana
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kai -d nexus_arcana"]
      interval: 10s
      timeout: 5s
      retries: 5

  nexus:
    # GIT_SHA — короткий хэш коммита для старт-пинга версии. Если deploy не
    # передал (forced-command не прокидывает env) → пусто, стамп = время сборки.
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
      provenance: false
      sbom: false
    image: nexus-arcana-bots
    container_name: nexus-bot
    command: ["python", "-m", "nexus.nexus_bot"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # #191: data/*.db (стрики, ru_calendar, ...) жили только в файловой системе
    # контейнера — каждый `up -d --build` (деплой на push в main, а пушим часто)
    # стирал их без следа. Отсюда стрик всегда 0, несмотря на регулярные Done.
    # Postgres такую защиту уже имел (volume pgdata) — sqlite её не имела.
    volumes:
      - nexus_sqlite_data:/app/data
    restart: unless-stopped
    # heartbeat: unhealthy если /tmp/heartbeat протух (процесс завис/умер).
    # $$ → литеральный $ после compose-интерполяции.
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(cat /tmp/heartbeat) )) -lt 90"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  arcana:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
      provenance: false
      sbom: false
    image: nexus-arcana-bots
    container_name: arcana-bot
    command: ["python", "-m", "arcana.bot"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # #191: своя папка, не общая с nexus — оба контейнера пишут в data/ (напр.
    # ru_calendar.db) независимо, общий volume рисковал бы sqlite file-lock
    # контеншном между двумя процессами.
    volumes:
      - arcana_sqlite_data:/app/data
    restart: unless-stopped
    # heartbeat: unhealthy если /tmp/heartbeat протух (процесс завис/умер).
    # $$ → литеральный $ после compose-интерполяции.
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(cat /tmp/heartbeat) )) -lt 90"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ⭐ Zarya — heylark Booking concierge bot (@heylark_booking_bot). #23.
  # Свой узкий Dockerfile → образ пересобирается только на изменения core/,
  # zarya/ и table-defs; правки nexus/arcana handlers Zarya не рестартят.
  # provenance/sbom: false — BuildKit по умолчанию прикладывает build-attestation
  # (таймштамп/builder id) к КАЖДОЙ сборке, даже когда все слои CACHED. Это меняет
  # digest образа на каждом деплое → `up -d` видел «новый образ» и пересоздавал
  # (рестарт+пинг) Зарю на посторонних коммитах, хотя ни один слой не менялся.
  # #222: этих флагов ЗДЕСЬ недостаточно — `docker compose build` (compose v5,
  # bake-режим) их игнорирует и всё равно штампует attestation-manifest, digest
  # всё равно скачет. Реальный деплой (~/deploy.sh на VPS, вне репо) поэтому
  # собирает образы напрямую через `docker buildx build --provenance=false
  # --sbom=false --load` в обход `docker compose build` — только это стабильно.
  # Эти YAML-флаги оставлены как fallback для локального `docker compose build`.
  zarya:
    build:
      context: .
      dockerfile: zarya/Dockerfile
      provenance: false
      sbom: false
    image: zarya-bot
    container_name: zarya-bot
    command: ["python", "-m", "zarya"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(cat /tmp/heartbeat) )) -lt 90"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
  nexus_sqlite_data:
  arcana_sqlite_data:

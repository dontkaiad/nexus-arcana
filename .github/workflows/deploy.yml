name: Deploy
# Деплой идёт ТОЛЬКО после зелёного workflow «Tests» на main (test.yml).
# workflow_dispatch — ручной передеплой без тестов (осознанно).
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Только чтение: список запусков этого workflow и compare API для шага plan.
    permissions:
      contents: read
      actions: read
    steps:
      # Какие файлы изменились С ПОСЛЕДНЕГО УСПЕШНОГО ДЕПЛОЯ до деплоимого коммита (а не в последнем
      # коммите): пуш из нескольких коммитов не теряет изменения в предыдущих. Код репозитория не
      # нужен, поэтому checkout нет; токен — только в env шага, не в теле run.
      - name: Which bots changed since the last successful deploy
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          nexus=false; arcana=false; zarya=false; note=""; files=""; all=""
          if [ "$EVENT" = workflow_dispatch ]; then
            all="manual redeploy / all bots"
          else
            prev="$(gh run list --repo "$REPO" --workflow deploy.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // empty' 2>/dev/null || true)"
            if [ -z "$prev" ]; then
              all="no previous successful deploy to compare with: all bots"
            elif [ "$prev" = "$HEAD_SHA" ]; then
              all="same commit as the last successful deploy: all bots"
            else
              cmp="$(gh api "repos/$REPO/compare/$prev...$HEAD_SHA" --jq '.status, ((.files // [])[].filename)' 2>/dev/null || true)"
              status="$(head -n 1 <<<"$cmp")"
              files="$(tail -n +2 <<<"$cmp")"
              if [ "$status" != ahead ] || [ -z "$files" ]; then
                all="could not list the changes since the last deploy: all bots"
              elif [ "$(wc -l <<<"$files")" -ge 300 ]; then
                all="300 or more changed files (the API list is cut): all bots"
              fi
            fi
          fi
          if [ -n "$all" ]; then
            nexus=true; arcana=true; zarya=true; note="$all"
          elif grep -qE '^(core/|alembic/|alembic\.ini|docker/|Dockerfile|docker-compose\.yml|requirements|scripts/deploy\.sh|zarya/build-inputs\.txt)' <<<"$files"; then
            nexus=true; arcana=true; zarya=true; note="shared code: all bots"
          else
            grep -qE '^(nexus/|miniapp/)' <<<"$files" && nexus=true
            grep -qE '^arcana/' <<<"$files" && arcana=true
            grep -qE '^zarya/' <<<"$files" && zarya=true
            if [ "$nexus$arcana$zarya" = falsefalsefalse ]; then
              nexus=true; note="no bot code changed (docs, tests, CI)"
            fi
          fi
          { echo "nexus=$nexus"; echo "arcana=$arcana"; echo "zarya=$zarya"; echo "note=$note"; } >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        id: deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: "20m"
          # Сервер использует forced command (~/.ssh/authorized_keys:
          # command="<deploy user>/deploy.sh") → ЭТОТ script игнорируется, всегда
          # гоняется deploy.sh. ssh-action к тому же глотает exit-код. Детект
          # фейла — снаружи (Verify) по маркеру deploy.sh «deploy done», который
          # печатается ПОСЛЕДНЕЙ строкой только при успехе (set -euo pipefail).
          # capture_stdout кладёт вывод в steps.deploy.outputs.stdout для Verify.
          capture_stdout: true
          script: |
            # Forced command in authorized_keys runs <deploy user>/deploy.sh; script body ignored. See ADR-0014.

      - name: Verify deploy marker
        if: always()
        env:
          OUT: ${{ steps.deploy.outputs.stdout }}
        run: |
          echo "$OUT"
          echo "$OUT" | grep -q "deploy done" || { echo "marker missing — deploy failed"; exit 1; }

      # Сообщения в ops-группу через dontkaiad/ops-notify (копия heylark-infra/ops, закреплена по SHA;
      # репозиторий публичный). Топик по боту берётся из её topics.env; токен и chat id передаются
      # входами. Успех: по изменённым путям (см. шаг plan). Падение: во все три топика, деплой общий.
      - name: Notify nexus (deploy ok)
        if: success() && steps.plan.outputs.nexus == 'true'
        uses: dontkaiad/ops-notify@8e673e29a5027518a99de11c33ba4034a3eb1b57 # v1
        with:
          project: nexus
          kind: deploy_ok
          body: ${{ steps.plan.outputs.note }}
          token: ${{ secrets.TG_LOG_BOT_TOKEN }}
          chat-id: ${{ secrets.TG_LOG_CHAT_ID }}

      - name: Notify arcana (deploy ok)
        if: success() && steps.plan.outputs.arcana == 'true'
        uses: dontkaiad/ops-notify@8e673e29a5027518a99de11c33ba4034a3eb1b57 # v1
        with:
          project: arcana
          kind: deploy_ok
          body: ${{ steps.plan.outputs.note }}
          token: ${{ secrets.TG_LOG_BOT_TOKEN }}
          chat-id: ${{ secrets.TG_LOG_CHAT_ID }}

      - name: Notify zarya (deploy ok)
        if: success() && steps.plan.outputs.zarya == 'true'
        uses: dontkaiad/ops-notify@8e673e29a5027518a99de11c33ba4034a3eb1b57 # v1
        with:
          project: zarya
          kind: deploy_ok
          body: ${{ steps.plan.outputs.note }}
          token: ${{ secrets.TG_LOG_BOT_TOKEN }}
          chat-id: ${{ secrets.TG_LOG_CHAT_ID }}

      - name: Notify nexus (deploy failed)
        if: failure()
        uses: dontkaiad/ops-notify@8e673e29a5027518a99de11c33ba4034a3eb1b57 # v1
        with:
          project: nexus
          kind: deploy_fail
          title: Deploy over SSH (details in the run log)
          token: ${{ secrets.TG_LOG_BOT_TOKEN }}
          chat-id: ${{ secrets.TG_LOG_CHAT_ID }}

      - name: Notify arcana (deploy failed)
        if: failure()
        uses: dontkaiad/ops-notify@8e673e29a5027518a99de11c33ba4034a3eb1b57 # v1
        with:
          project: arcana
          kind: deploy_fail
          title: Deploy over SSH (details in the run log)
          token: ${{ secrets.TG_LOG_BOT_TOKEN }}
          chat-id: ${{ secrets.TG_LOG_CHAT_ID }}

      - name: Notify zarya (deploy failed)
        if: failure()
        uses: dontkaiad/ops-notify@8e673e29a5027518a99de11c33ba4034a3eb1b57 # v1
        with:
          project: zarya
          kind: deploy_fail
          title: Deploy over SSH (details in the run log)
          token: ${{ secrets.TG_LOG_BOT_TOKEN }}
          chat-id: ${{ secrets.TG_LOG_CHAT_ID }}

name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kai
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nexus_arcana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kai -d nexus_arcana"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://kai:ci@localhost:5432/nexus_arcana
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m alembic upgrade head
      - run: python -m pytest tests -q -p no:cacheprovider

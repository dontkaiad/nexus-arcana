name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  frontend:
    # Mini App: необъявленные идентификаторы (ReferenceError → пустой экран) и сборка.
    # Деплой ждёт весь workflow «Tests», так что красный lint блокирует выкладку.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: miniapp/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: miniapp/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kai
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: nexus_arcana
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kai -d nexus_arcana"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://kai:ci@localhost:5432/nexus_arcana
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m alembic upgrade head
      - run: python -m pytest tests -q -p no:cacheprovider
      - name: Offline evals (synthetic; classifier / retrieval recall@5 / grounding)
        run: python -m evals offline

      # Сообщения в ops-группу: общий action (dontkaiad/ops-notify, копия heylark-infra/ops; репозиторий
      # публичный, приватный оригинал из него недоступен), закреплён по SHA. Топик берётся из его topics.env,
      # токен и chat id передаются входами, не подставляются в скрипт. Только push в main (там блокируется
      # деплой); PR-ранов не спамим. Тесты упали: деплой не запущен, это касается всех трёх ботов.
      - name: Notify nexus (tests failed)
        if: failure() && github.event_name == 'push'
        uses: dontkaiad/ops-notify@8e673e29a5027518a99de11c33ba4034a3eb1b57 # v1
        with:
          project: nexus
          kind: deploy_fail
          title: tests failed, deploy not started
          token: ${{ secrets.TG_LOG_BOT_TOKEN }}
          chat-id: ${{ secrets.TG_LOG_CHAT_ID }}

      - name: Notify arcana (tests failed)
        if: failure() && github.event_name == 'push'
        uses: dontkaiad/ops-notify@8e673e29a5027518a99de11c33ba4034a3eb1b57 # v1
        with:
          project: arcana
          kind: deploy_fail
          title: tests failed, deploy not started
          token: ${{ secrets.TG_LOG_BOT_TOKEN }}
          chat-id: ${{ secrets.TG_LOG_CHAT_ID }}

      - name: Notify zarya (tests failed)
        if: failure() && github.event_name == 'push'
        uses: dontkaiad/ops-notify@8e673e29a5027518a99de11c33ba4034a3eb1b57 # v1
        with:
          project: zarya
          kind: deploy_fail
          title: tests failed, deploy not started
          token: ${{ secrets.TG_LOG_BOT_TOKEN }}
          chat-id: ${{ secrets.TG_LOG_CHAT_ID }}

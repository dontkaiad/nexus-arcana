<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zarya · Календарь Кай Ларк</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* type roles from Nexus / Arcana: Newsreader display · Manrope body · JetBrains Mono numbers */
  :root{
    --ink:#3a2f24; --ink-soft:#5b4d3d; --muted:#7a6b5a; --faint:#9a8a76;
    --accent:#4a7a5e; --accent-2:#3c6650; --accent-ink:#fff;
    --sun:#4a7a5e; --moon:#8a6db0; --tide:#3f7f8c; --gold:#b8822a;
    --glass:rgba(255,252,244,.6); --glass-strong:rgba(255,252,244,.82);
    --glass-line:rgba(120,92,54,.2); --glass-hi:rgba(255,255,255,.6);
    --cell-bg:rgba(255,250,239,.5); --wash-sun:rgba(74,122,94,.16); --wash-moon:rgba(138,109,176,.16);
    --glow:rgba(184,130,42,.18); --shadowc:rgba(90,64,32,.12); --ring-tick:rgba(120,92,54,.3);
    --nexus:var(--sun); --arcana:var(--moon); --book:var(--tide); --busy:var(--muted);
    --radius:16px;
  }
  :root[data-theme="dark"]{
    --ink:#f0e8dc; --ink-soft:#d8d1c3; --muted:#bcb4a4; --faint:#9a9282;
    --accent:#6fb6a2; --accent-2:#8fceb8; --accent-ink:#0a1512;
    --sun:#7fc89a; --moon:#c3aef0; --tide:#7fc4d4; --gold:#e0b263;
    --glass:rgba(28,32,50,.55); --glass-strong:rgba(34,38,58,.72);
    --glass-line:rgba(180,188,215,.2); --glass-hi:rgba(255,240,220,.07);
    --cell-bg:rgba(180,188,215,.08); --wash-sun:rgba(127,200,154,.18); --wash-moon:rgba(195,174,240,.22);
    --glow:rgba(138,168,200,.24); --shadowc:rgba(0,0,0,.34); --ring-tick:rgba(195,205,235,.4);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:var(--ink);
    font:15px/1.5 "Manrope","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  h1,h2,h3{margin:0;font-weight:500;letter-spacing:0}
  .disp,.pname,.bname,.cnav .t,.detailh h3,.bookh{font-family:"Newsreader",Georgia,serif;font-style:italic;font-weight:500}
  .mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}
  button{font:inherit;cursor:pointer;border:1px solid var(--glass-line);background:var(--cell-bg);
    color:var(--ink);border-radius:10px;padding:.55em .9em;transition:border-color .12s,background .12s,transform .12s}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  button.mini{padding:.32em .62em;font-size:.85em;border-radius:8px}
  button:active{transform:scale(.97)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input,select,textarea{font:inherit;width:100%;padding:.5em .65em;border:1px solid var(--glass-line);
    border-radius:10px;background:var(--cell-bg);color:var(--ink)}

  /* ── sky — reused from Nexus / Arcana, cross-fades on theme switch ── */
  .sky{position:fixed;inset:0;z-index:-1;overflow:hidden;transition:opacity 1.4s ease}
  .sky::after{content:"";position:absolute;inset:0;animation:shine 8s ease-in-out infinite alternate}
  @keyframes shine{from{opacity:.55}to{opacity:1}}
  .sky.day{background:
    radial-gradient(1100px 640px at 12% -12%,rgba(74,122,94,.17),transparent 58%),
    radial-gradient(940px 560px at 104% 112%,rgba(184,130,42,.18),transparent 55%),
    linear-gradient(180deg,#f2e9da,#ece1cf)}
  .sky.day::after{background:radial-gradient(circle at 82% 12%,rgba(255,236,190,.34),transparent 42%)}
  .sky.night{background:linear-gradient(180deg,#0a0e18 0%,#101828 24%,#1a2240 54%,#2a1a3a 76%,#0e1119 100%);opacity:0}
  .sky.night::after{background:radial-gradient(circle at 24% 20%,rgba(140,170,200,.2),transparent 52%)}
  :root[data-theme="dark"] .sky.day{opacity:0}
  :root[data-theme="dark"] .sky.night{opacity:1}
  .orb{position:absolute;right:9%;border-radius:50%;pointer-events:none}
  .sky.day .orb{bottom:20%;width:150px;height:150px;filter:blur(10px);
    background:radial-gradient(circle,rgba(255,235,180,.5),rgba(244,200,120,.28) 34%,rgba(244,200,120,0) 72%)}
  .sky.night .orb{top:11%;width:120px;height:120px;filter:blur(7px);
    background:radial-gradient(circle,rgba(220,230,250,.4),rgba(180,200,235,.22) 36%,rgba(140,160,200,0) 78%)}
  .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;
    animation:tw 3.6s ease-in-out infinite alternate}
  @keyframes tw{from{opacity:.2;transform:scale(.8)}to{opacity:.95;transform:scale(1.1)}}
  @media (prefers-reduced-motion:reduce){.sky,.sky::after,.star{animation:none;transition:none}}

  .glass{position:relative;border-radius:16px;padding:14px 16px;background:var(--glass);
    border:1px solid var(--glass-line);backdrop-filter:blur(24px) saturate(140%);
    -webkit-backdrop-filter:blur(24px) saturate(140%);
    box-shadow:inset 0 1px 0 var(--glass-hi),0 2px 16px var(--shadowc)}

  .app{display:grid;grid-template-columns:292px minmax(0,1fr);align-items:start;min-height:100vh}
  @media(max-width:960px){.app{grid-template-columns:1fr}}
  .rail{align-self:start;padding:20px 16px;display:flex;flex-direction:column;gap:11px}

  /* ── profile — portrait in a glowing sigil ring ── */
  .me{display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;padding:16px 0 2px}
  .me .ring{position:relative;width:126px;height:126px;border-radius:50%;padding:3px;
    background:conic-gradient(from -50deg,var(--accent),var(--gold),var(--accent));
    box-shadow:0 14px 34px -10px var(--glow)}
  .me .ring::before{content:"";position:absolute;inset:-6px;border-radius:50%;z-index:-1;
    background:conic-gradient(from 0deg,transparent,var(--accent),transparent 42%);
    filter:blur(4px);opacity:.75;animation:spin 12s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.me .ring::before{animation:none}}
  .me .ring::after{content:"";position:absolute;inset:-6px;border-radius:50%;
    border:1px dashed var(--ring-tick);opacity:.9}
  .me .ava{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 30%;display:block}
  .me .pname{font-size:1.62rem;line-height:1.06;color:var(--ink);text-shadow:0 1px 2px var(--shadowc)}
  :root:not([data-theme="dark"]) .me .ring{box-shadow:0 0 0 1px rgba(255,255,255,.55),
    0 16px 36px -8px rgba(74,122,94,.5),0 0 30px rgba(201,138,46,.32)}
  :root:not([data-theme="dark"]) .me .ring::before{opacity:.95;filter:blur(5px)}

  .eyebrow{font-size:.67rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:500}
  .blk>.eyebrow{display:block;margin-bottom:9px}
  .tip p{margin:4px 0 0;font-size:.89rem;line-height:1.5;color:var(--ink)}
  .tip .eyebrow{color:var(--accent)}
  .hintline{margin:8px 0 0;font-size:.8rem;line-height:1.45;color:var(--ink-soft)}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .seg button{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;
    padding:11px 8px;font-size:.83rem;line-height:1.2;color:var(--ink);
    background:var(--cell-bg);border:1px solid var(--glass-line);border-radius:11px}
  .seg button .em{font-size:1.1rem}
  .seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .legend{display:flex;flex-direction:column;gap:8px;font-size:.87rem;color:var(--ink-soft)}
  .legend span{display:flex;align-items:center;gap:9px}
  .legend i{width:11px;height:11px;border-radius:4px;flex:none}
  .foot{margin-top:6px;text-align:center;font-size:.8rem;color:var(--ink-soft)}

  /* admin sections */
  .sec>summary{list-style:none;cursor:pointer;padding:12px 15px;display:flex;align-items:center;gap:8px;font-size:.95rem}
  .sec>summary::-webkit-details-marker{display:none}
  .sec>summary::after{content:"⌄";margin-left:auto;color:var(--muted);transition:transform .2s}
  .sec[open]>summary::after{transform:rotate(180deg)}
  .sec .body{padding:0 15px 14px}
  .sec .hint{font-size:.78rem;color:var(--ink-soft);margin:0 0 9px;line-height:1.4}
  .stack{display:flex;flex-direction:column;gap:7px}
  .item{border:1px solid var(--glass-line);border-radius:10px;padding:8px 11px;font-size:.85rem;background:var(--cell-bg)}
  .item .top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
  .form{display:flex;flex-direction:column;gap:.45rem;margin-top:.6rem}
  .form .two{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
  .empty{border:1px dashed var(--glass-line);border-radius:10px;padding:11px;font-size:.82rem;color:var(--muted)}

  /* header */
  .head{display:flex;align-items:center;gap:11px;padding:20px 30px 0}
  .head .sp{flex:1}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .orb-mark{flex:none;filter:drop-shadow(0 2px 8px rgba(0,0,0,.25))}
  .bwrap{display:flex;flex-direction:column;min-width:0}
  .bname{font-size:1.34rem;line-height:1.16;color:var(--ink);text-shadow:0 1px 2px var(--shadowc)}
  .brole{font-family:"JetBrains Mono",monospace;font-size:.72rem;letter-spacing:.01em;color:var(--muted)}
  .brole .tg{opacity:.8}
  .mode-toggle{margin-left:auto;display:inline-flex;align-items:center;gap:8px;padding:8px 15px;
    border-radius:100px;flex:none;color:var(--ink);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    background:var(--glass);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 var(--glass-hi)}
  .mode-toggle svg{display:block}
  .mode-toggle .t-night{display:none}
  :root[data-theme="dark"] .mode-toggle .t-day{display:none}
  :root[data-theme="dark"] .mode-toggle .t-night{display:inline-flex;align-items:center;gap:8px}
  .mode-toggle .t-day{display:inline-flex;align-items:center;gap:8px}

  /* main */
  .main{padding:16px 30px 40px;display:flex;gap:18px;align-items:flex-start}
  @media(max-width:760px){.main{flex-direction:column}}
  .calcol{flex:1 1 auto;min-width:0}
  .card{background:var(--glass);border:1px solid var(--glass-line);border-radius:18px;padding:18px 19px;
    backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);
    box-shadow:inset 0 1px 0 var(--glass-hi),0 24px 60px -18px var(--glow),0 2px 12px var(--shadowc)}
  .cnav{display:flex;align-items:center;gap:.5rem;margin-bottom:14px}
  .cnav .t{font-size:1.22rem;text-transform:capitalize;min-width:9.4rem}
  .cnav .sp{flex:1}
  .dowrow{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:7px}
  .dow{font-family:"JetBrains Mono",monospace;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-soft);text-align:center}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .day{position:relative;background:var(--cell-bg);border:1px solid transparent;border-radius:12px;
    min-height:92px;padding:8px 9px;display:flex;flex-direction:column;gap:5px;text-align:left;overflow:hidden;color:var(--ink)}
  .day:hover{border-color:var(--accent)}
  .day.out{opacity:.3}
  .day.k-sun{background:var(--wash-sun)}
  .day.k-moon{background:var(--wash-moon)}
  .day.k-mix{background:linear-gradient(135deg,var(--wash-sun) 0 50%,var(--wash-moon) 50% 100%)}
  .day.avail{box-shadow:inset 0 0 0 1px var(--glass-line)}
  .day.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
  .day.today .dn{color:var(--gold)}
  .day.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
  .day .dn{font-family:"JetBrains Mono",monospace;font-size:.82rem}
  .dots{display:flex;gap:4px;flex-wrap:wrap}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--busy)}
  .dot.nexus{background:var(--sun)} .dot.arcana{background:var(--moon)} .dot.booking{background:var(--tide)}
  .day .free{margin-top:auto;font-family:"JetBrains Mono",monospace;font-size:.64rem;color:var(--accent)}

  .detailcol{flex:0 0 266px;position:sticky;top:16px}
  @media(max-width:760px){.detailcol{flex:1 1 auto;position:static;width:100%}}
  .detailh{display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .detailh h3{font-size:1.14rem;flex:1}
  .ev{display:flex;align-items:center;gap:9px;font-size:.88rem;padding:3px 0;color:var(--ink-soft)}
  .ev i{width:3px;height:1.1em;border-radius:2px;flex:none;background:var(--busy)}
  .ev i.nexus{background:var(--sun)} .ev i.arcana{background:var(--moon)} .ev i.booking{background:var(--tide)}
  .ev .tm{font-family:"JetBrains Mono",monospace;font-size:.8rem;color:var(--ink)}
  .bookh{margin:15px 0 9px;font-size:1rem}
  .slotwrap{display:flex;flex-wrap:wrap;gap:7px}
  .slotwrap button{font-family:"JetBrains Mono",monospace;padding:7px 10px;font-size:.84rem}
  .slotwrap button.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .toast{position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);background:var(--ink);
    color:var(--glass-strong);padding:.65rem 1.1rem;border-radius:12px;z-index:30;
    opacity:0;pointer-events:none;transition:opacity .2s;backdrop-filter:blur(8px)}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="sky day"><span class="orb"></span></div>
<div class="sky night"><span class="orb"></span><span id="stars"></span></div>

<div class="app">
  <aside class="rail" id="rail"></aside>
  <div>
    <header class="head">
      <span class="brand" id="brandOrb"></span>
      <span class="bwrap">
        <span class="bname">Заря</span>
        <span class="brole">букинг-менеджер Кай · <span class="tg">@heylark_booking_bot</span></span>
      </span>
      <span class="sp"></span>
      <button id="theme" class="mode-toggle" title="День / ночь" aria-label="Переключить тему">
        <span class="t-day"></span><span class="t-night"></span>
      </button>
    </header>
    <main class="main">
      <div class="calcol">
        <div class="card">
          <div class="cnav">
            <button id="prev" class="mini">‹</button>
            <span class="t" id="mtitle"></span>
            <button id="next" class="mini">›</button>
            <span class="sp"></span>
            <button id="today" class="mini">сегодня</button>
          </div>
          <div class="dowrow" id="dow"></div>
          <div class="grid" id="grid"></div>
        </div>
      </div>
      <div class="detailcol" id="detailcol" style="display:none">
        <div class="card">
          <div class="detailh">
            <h3 id="detailTitle"></h3>
            <button class="mini" id="detailClose">✕</button>
          </div>
          <div id="detail"></div>
        </div>
      </div>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>

const BOOK_NOTE="Заря подтвердит запись в Telegram и пришлёт напоминания — тебе и Кай. Время по UTC+3.";

const ICO={
  moon:'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>',
  arrR:'<line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>',
  arrL:'<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
};
const sv=p=>`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ORB_SUN='<svg class="orb-mark" width="40" height="40" viewBox="0 0 54 54"><defs><radialGradient id="sg" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff2c8"/><stop offset=".4" stop-color="#f4c66e"/><stop offset="1" stop-color="#b07a2e"/></radialGradient></defs><circle cx="27" cy="27" r="22" fill="#f4c66e" opacity=".2"/><circle cx="27" cy="27" r="17" fill="none" stroke="#f4c66e" stroke-width=".8" opacity=".6"/><circle cx="27" cy="27" r="13" fill="url(#sg)"/></svg>';
const ORB_MOON='<svg class="orb-mark" width="40" height="40" viewBox="0 0 54 54"><defs><radialGradient id="mg" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#d4dce8"/><stop offset="1" stop-color="#6b7590"/></radialGradient></defs><circle cx="27" cy="27" r="22" fill="#d4dce8" opacity=".15"/><circle cx="27" cy="27" r="17" fill="none" stroke="#d4dce8" stroke-width=".8" opacity=".5"/><circle cx="27" cy="27" r="13" fill="url(#mg)"/></svg>';

const st={me:{role:"guest"},ctx:"friends",month:new Date(),events:[],slots:[],windows:[],sel:null};

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2600);}
async function api(p,o){const r=await fetch(API+p,{credentials:"include",...o});
  if(!r.ok)throw new Error(r.status+" "+await r.text().catch(()=>""));return r.json();}
function loginUrl(){return "https://login.heylark.dev/?next="+encodeURIComponent(location.href);}

function stars(){
  let s=7,out="";const rnd=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff;
  for(let i=0;i<18;i++){out+=`<span class="star" style="left:${(rnd()*96+2).toFixed(1)}%;top:${(rnd()*58+2).toFixed(1)}%;animation-delay:${(rnd()*3).toFixed(1)}s"></span>`;}
  $("#stars").innerHTML=out;
}
function renderChrome(){
  const dark=document.documentElement.dataset.theme==="dark";
  $("#brandOrb").innerHTML=dark?ORB_MOON:ORB_SUN;
  $("#theme .t-day").innerHTML=sv(ICO.moon)+sv(ICO.arrR);
  $("#theme .t-night").innerHTML=sv(ICO.arrL)+sv(ICO.sun);
}
function initTheme(){
  const s=localStorage.getItem("z-th");
  document.documentElement.dataset.theme=s||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  $("#theme").onclick=()=>{
    const n=document.documentElement.dataset.theme==="dark"?"light":"dark";
    document.documentElement.dataset.theme=n;localStorage.setItem("z-th",n);renderChrome();
  };
  renderChrome();
}

/* ── rail ─────────────────────────────────────────────────────────── */
function meBlock(){
  return `<div class="me">
    <div class="ring"><img class="ava" src="${AVA}" alt="Кай Ларк"></div>
    <h2 class="pname">Кай Ларк</h2>
  </div>`;
}
function rail(){
  const r=$("#rail");
  if(st.me.role==="admin"){ r.innerHTML=meBlock()+adminSections(); wireAdmin(); return; }

  const legend = st.me.role==="friend" ? `
    <div class="legend">
      <span><i style="background:var(--sun)"></i>☀️ дела Nexus</span>
      <span><i style="background:var(--moon)"></i>🌒 практика Arcana</span>
      <span><i style="background:var(--tide)"></i>брони</span>
    </div>` : `
    <div class="legend"><span><i style="background:var(--busy)"></i>занято</span></div>`;

  r.innerHTML = meBlock() + `
    <div class="glass tip" id="tip"><span class="eyebrow">совет</span><p>…</p></div>
    <div class="glass blk">
      <span class="eyebrow">записаться на</span>
      <div class="seg">
        <button data-c="friends" class="${st.ctx==="friends"?"on":""}">встреча</button>
        <button data-c="arcana" class="${st.ctx==="arcana"?"on":""}">расклад / ритуал</button>
      </div>
      <p class="hintline">выбери день → появятся свободные слоты · время по UTC+3</p>
    </div>
    <div class="glass blk"><span class="eyebrow">обозначения</span>${legend}</div>
    <div class="glass blk"><span class="eyebrow">бронь</span>
      <p class="hintline" style="margin-top:0">${BOOK_NOTE}</p>
      ${st.me.role==="guest"?`<button class="primary" style="margin-top:10px;width:100%" onclick="location.href='${loginUrl()}'">Бронь</button>`:""}
    </div>
    <div class="foot">календарь ведёт ⭐ Заря</div>`;
  r.querySelectorAll(".seg button").forEach(b=>b.onclick=async()=>{st.ctx=b.dataset.c;await load();rail();detail();});
  loadTip();
}
async function loadTip(){try{const t=await api("/tip?context="+st.ctx);const e=$("#tip p");if(e)e.textContent=t.tip;}catch(_){}}

/* ── admin: collapsible sections ──────────────────────────────────── */
function adminSections(){
  return `
  <details class="glass sec" open><summary>📥 Заявки</summary><div class="body">
    <p class="hint">записи на расклады ждут твоего «да»</p>
    <div class="stack" id="reqBox">…</div>
  </div></details>
  <details class="glass sec"><summary>🗓 Когда я свободна</summary><div class="body">
    <p class="hint">окна по дням недели — из них считаются слоты для записи</p>
    <div class="stack" id="winBox">…</div>
    <div class="form">
      <div class="two"><select id="w_ctx"><option value="friends">для встреч</option><option value="arcana">для раскладов</option></select>
        <select id="w_wd">${DOW.map((d,i)=>`<option value="${i}">${d}</option>`).join("")}</select></div>
      <div class="two"><input id="w_s" type="time" value="14:00"><input id="w_e" type="time" value="20:00"></div>
      <button class="primary mini" id="w_add">＋ добавить окно</button>
    </div>
  </div></details>
  <details class="glass sec"><summary>☕ Типы встреч</summary><div class="body">
    <p class="hint">кофе, созвон, расклад… клиент выбирает при записи</p>
    <div class="stack" id="typBox">…</div>
    <div class="form">
      <div class="two"><input id="t_title" placeholder="Название (Кофе)"><input id="t_slug" placeholder="slug (coffee)"></div>
      <div class="two"><select id="t_ctx"><option value="friends">для встреч</option><option value="arcana">для раскладов</option></select>
        <input id="t_dur" type="number" value="60" placeholder="минут"></div>
      <button class="primary mini" id="t_add">＋ добавить тип</button>
    </div>
  </div></details>
  <details class="glass sec"><summary>🚫 Когда я недоступна</summary><div class="body">
    <p class="hint">отпуск, поездки — эти даты просто не показываются для записи</p>
    <div class="stack" id="offBox">…</div>
    <div class="form">
      <div class="two"><input id="o_s" type="date"><input id="o_e" type="date"></div>
      <input id="o_r" placeholder="причина (отпуск)">
      <button class="primary mini" id="o_add">＋ отметить</button>
    </div>
  </div></details>
  <div class="foot">календарь ведёт ⭐ Заря</div>`;
}
function wireAdmin(){
  reqBox(); winBox(); typBox(); offBox();
  $("#w_add").onclick=async()=>{try{
    await api("/availability",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({context:$("#w_ctx").value,weekday:+$("#w_wd").value,
        start_time:$("#w_s").value,end_time:$("#w_e").value})});
    toast("окно добавлено");winBox();load().then(gridR);
  }catch(e){toast("не вышло: "+e.message);}};
  $("#t_add").onclick=async()=>{try{
    await api("/meeting-types",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({title:$("#t_title").value,slug:$("#t_slug").value,
        context:$("#t_ctx").value,duration_min:+$("#t_dur").value})});
    toast("тип добавлен");typBox();
  }catch(e){toast("не вышло: "+e.message);}};
  $("#o_add").onclick=async()=>{try{
    await api("/blocks",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({start:$("#o_s").value+"T00:00",end:$("#o_e").value+"T23:59",reason:$("#o_r").value})});
    toast("отмечено");offBox();load().then(gridR);
  }catch(e){toast("не вышло: "+e.message);}};
}
async function reqBox(){const el=$("#reqBox");try{
  const d=await api("/requests?status=open");
  const p=d.requests.filter(r=>r.status==="pending");
  el.innerHTML = p.length ? p.map(r=>`<div class="item">
    <div class="top"><b>${r.requester_name}</b><span class="muted">${new Date(r.start).toLocaleString("ru",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</span></div>
    ${r.note?`<div class="muted">${r.note}</div>`:""}
    <div class="top" style="margin-top:.4rem"><button class="primary mini" data-ok="${r.id}">✅ да</button>
      <button class="mini" data-no="${r.id}">❌ нет</button></div></div>`).join("")
    : `<div class="empty">Заявок нет</div>`;
  el.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>dec(b.dataset.ok,"confirm"));
  el.querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>dec(b.dataset.no,"decline"));
}catch(e){el.innerHTML=`<div class="empty">${e.message}</div>`;}}
async function dec(id,a){try{await api(`/requests/${id}/${a}`,{method:"POST"});toast("готово");reqBox();load().then(gridR);}catch(e){toast(e.message);}}

async function winBox(){const el=$("#winBox");try{
  const d=await api("/availability");st.windows=d.windows;
  el.innerHTML = d.windows.length ? d.windows.map(w=>`<div class="item"><div class="top">
    <span>${DOW[w.weekday]} ${w.start_time}–${w.end_time} · ${w.context==="arcana"?"расклады":"встречи"}</span>
    <button class="mini" data-d="${w.id}">✕</button></div></div>`).join("")
    : `<div class="empty">Нет окон — добавь первое, и друзья смогут записываться 👇</div>`;
  el.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{await api("/availability/"+b.dataset.d,{method:"DELETE"});winBox();load().then(gridR);});
}catch(e){el.innerHTML=`<div class="empty">${e.message}</div>`;}}

async function typBox(){const el=$("#typBox");try{
  const d=await api("/meeting-types");
  el.innerHTML = d.types.length ? d.types.map(m=>`<div class="item"><div class="top">
    <span>${m.title||m.slug} · ${m.duration_min}м · ${m.context==="arcana"?"расклады":"встречи"}</span>
    <button class="mini" data-dt="${m.id}">✕</button></div></div>`).join("")
    : `<div class="empty">Типов нет — необязательно, но клиенту удобнее выбрать</div>`;
  el.querySelectorAll("[data-dt]").forEach(b=>b.onclick=async()=>{await api("/meeting-types/"+b.dataset.dt,{method:"DELETE"});typBox();});
}catch(e){el.innerHTML=`<div class="empty">${e.message}</div>`;}}

async function offBox(){const el=$("#offBox");try{
  const d=await api("/blocks");
  el.innerHTML = d.blocks.length ? d.blocks.map(b=>`<div class="item"><div class="top">
    <span>${new Date(b.start_at).toLocaleDateString("ru")} – ${new Date(b.end_at).toLocaleDateString("ru")} · ${b.reason||"—"}</span>
    <button class="mini" data-db="${b.id}">✕</button></div></div>`).join("")
    : `<div class="empty">Ничего не отмечено</div>`;
  el.querySelectorAll("[data-db]").forEach(b=>b.onclick=async()=>{await api("/blocks/"+b.dataset.db,{method:"DELETE"});offBox();load().then(gridR);});
}catch(e){el.innerHTML=`<div class="empty">${e.message}</div>`;}}

/* ── calendar ─────────────────────────────────────────────────────── */
function monthCells(base){
  const f=new Date(base.getFullYear(),base.getMonth(),1);
  const sd=(f.getDay()+6)%7, out=[];
  for(let i=0;i<42;i++){const d=new Date(f);d.setDate(1-sd+i);out.push(d);}
  return out;
}
const evsDay=d=>st.events.filter(e=>new Date(e.start)<new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)
  && new Date(e.end)>new Date(d.getFullYear(),d.getMonth(),d.getDate()));
const slotsDay=d=>st.slots.filter(s=>sameDay(new Date(s.start),d));
const hasWindow=d=>st.windows.some(w=>+w.weekday===((d.getDay()+6)%7));

function washClass(kinds){
  if(!kinds.length) return "";
  const witchy=kinds.includes("arcana"), plain=kinds.some(k=>k!=="arcana");
  return witchy&&plain ? "k-mix" : witchy ? "k-moon" : "k-sun";
}

function gridR(){
  $("#mtitle").textContent = MON[st.month.getMonth()]+" "+st.month.getFullYear();
  $("#dow").innerHTML = DOW.map(x=>`<div class="dow">${x}</div>`).join("");
  const today=new Date();
  $("#grid").innerHTML = monthCells(st.month).map(d=>{
    const out=d.getMonth()!==st.month.getMonth();
    const kinds=[...new Set(evsDay(d).map(e=>e.kind||"busy"))].slice(0,5);
    const free=slotsDay(d).length;
    const wash = (st.me.role==="admin"&&!out) ? washClass(kinds) : "";
    const cls=["day",out?"out":"",wash,sameDay(d,today)?"today":"",
      st.sel&&sameDay(d,st.sel)?"sel":"", (st.me.role==="admin"&&!out&&!kinds.length&&hasWindow(d))?"avail":""].join(" ");
    return `<button class="${cls}" data-k="${d.getTime()}">
      <span class="dn">${d.getDate()}</span>
      <span class="dots">${kinds.map(k=>`<span class="dot ${k}"></span>`).join("")}</span>
      ${free?`<span class="free">${free} своб.</span>`:""}</button>`;
  }).join("");
  $("#grid").querySelectorAll(".day").forEach(b=>b.onclick=()=>{st.sel=new Date(+b.dataset.k);gridR();detail();});
}

function detail(){
  const col=$("#detailcol"), el=$("#detail");
  if(!st.sel){col.style.display="none";return;}
  col.style.display="block";
  const d=st.sel, evs=evsDay(d), sl=slotsDay(d);
  $("#detailTitle").textContent = `${d.getDate()} ${MON[d.getMonth()]}, ${DOW[(d.getDay()+6)%7]}`;
  const canBook = st.me.role==="admin"||st.me.role==="friend"||st.ctx==="arcana";
  const evH = evs.length ? evs.map(e=>{
    const k=e.kind||"busy";
    const lbl=e.title||(k==="nexus"?"дела Nexus":k==="arcana"?"практика Arcana":k==="booking"?"бронь":"занято");
    return `<div class="ev"><i class="${k}"></i><span class="tm">${T(e.start)}–${T(e.end)}</span> · ${lbl}</div>`;
  }).join("") : `<div class="muted" style="font-size:.9rem">Свободный день.</div>`;
  let slH;
  if(!canBook) slH=`<p class="hintline">${BOOK_NOTE}</p><button class="primary" style="margin-top:9px" onclick="location.href='${loginUrl()}'">Бронь</button>`;
  else if(!sl.length) slH=`<div class="muted" style="font-size:.9rem;margin-top:.6rem">Свободных слотов нет.${st.me.role==="admin"?" Добавь окно на "+DOW[(d.getDay()+6)%7]+".":""}</div>`;
  else slH=`<div class="slotwrap">${sl.map((s,i)=>`<button data-s="${s.start}" class="${i===0?"pri":""}">${T(s.start)}</button>`).join("")}</div>`;
  el.innerHTML = `<div>${evH}</div>
    <div class="bookh">Записаться${st.ctx==="arcana"?" · расклад / ритуал":""}</div>${slH}`;
  el.querySelectorAll(".slotwrap button").forEach(b=>b.onclick=()=>book(b.dataset.s));
}

async function book(startIso){
  if(st.me.role==="guest"&&st.ctx==="friends"){location.href=loginUrl();return;}
  let hours=1;
  if(st.ctx==="friends"){hours=await askHours();if(!hours)return;}
  try{
    const b=await api("/book",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({context:st.ctx,start:startIso,hours})});
    toast(b.status==="confirmed"?"Записано ✅":"Заявка отправлена — Кай подтвердит");
  }catch(e){toast(String(e).includes("409")?"Слот только что заняли":"Не вышло");}
  await load();gridR();detail();
}
function askHours(){return new Promise(res=>{
  const el=$("#detail"),bak=el.innerHTML;
  el.innerHTML=`<h3 class="bookh" style="margin-top:0">На сколько часов тебя занять?</h3>
    <div class="slotwrap">${[1,2,3,4].map(h=>`<button data-h="${h}">${h} ч</button>`).join("")}
    <button data-h="0">отмена</button></div>`;
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{el.innerHTML=bak;res(+b.dataset.h||null);});
});}

/* ── data ─────────────────────────────────────────────────────────── */
async function load(){
  try{const c=await api("/calendar?days=90&back=14");st.events=c.events;st.me.role=c.role;}catch(_){}
  try{const s=await api(`/slots?context=${st.ctx}&days=75`);st.slots=s.slots||[];}catch(_){st.slots=[];}
  if(st.me.role==="admin"){try{st.windows=(await api("/availability")).windows||[];}catch(_){st.windows=[];}}
  else st.windows=[];
}
async function boot(){
  initTheme();stars();
  try{st.me=await api("/me");}catch(_){}
  $("#prev").onclick=()=>{st.month.setMonth(st.month.getMonth()-1);gridR();};
  $("#next").onclick=()=>{st.month.setMonth(st.month.getMonth()+1);gridR();};
  $("#today").onclick=()=>{st.month=new Date();st.sel=new Date();gridR();detail();};
  $("#detailClose").onclick=()=>{st.sel=null;gridR();detail();};
  await load();
  rail();gridR();
}
boot();
</script>
